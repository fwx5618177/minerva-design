packages:
  - "apps/*"
  - "packages/*"

# One React (and framework) version per renderer family. Packages reference
# them as `catalog:<name>` (e.g. "react": "catalog:web").
catalogs:
  # React DOM, Web Components, docs site
  web:
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
  # React Native + Expo: the versions pinned by Expo SDK 57
  # (expo@57 bundledNativeModules.json: react 19.2.3, react-native 0.86.3)
  native:
    react: 19.2.3
    react-dom: 19.2.3
    react-native: ~0.86.3
    react-native-web: ~0.21.4
    "@types/react": ~19.2.18
    "@types/react-dom": ~19.2.7
    "@react-native/babel-preset": 0.86.3
    "@testing-library/react-native": ^14.1.0
    # test-renderer 1.3 needs react-reconciler 0.34 (react ^19.3)
    test-renderer: 1.2.0
    react-native-testing-mocks: 1.7.0
    babel-plugin-module-resolver: 5.0.2
  # Taro 4 (React-syntax mini-programs + H5) is on React 18
  taro:
    react: ^18.3.1
    react-dom: ^18.3.1
    "@types/react": ^18.3.12
    "@types/react-dom": ^18.3.1
    "@tarojs/components": 4.3.0
    "@tarojs/components-react": 4.3.0
    "@tarojs/runtime": 4.3.0
    "@tarojs/shared": 4.3.0
    "@tarojs/taro": 4.3.0
  vue:
    vue: ^3.5.43
    "@vue/shared": ^3.5.43
    "@vitejs/plugin-vue": ^6.0.9
    "@vue/test-utils": ^2.5.1
    "@testing-library/vue": ^8.1.0
    vue-tsc: ^3.3.12
  uni:
    "@dcloudio/types": 3.4.32
  angular:
    "@angular/build": 22.2.2
    "@angular/common": 22.2.2
    "@angular/compiler": 22.2.2
    "@angular/compiler-cli": 22.2.2
    "@angular/core": 22.2.2
    "@angular/forms": 22.2.2
    "@angular/platform-browser": 22.2.2
    "@angular/platform-server": 22.2.2
    "@angular/router": 22.2.2
    "@angular/ssr": 22.2.2
    ng-packagr: 22.2.4
    "@analogjs/vite-plugin-angular": 2.8.0
    "@analogjs/vitest-angular": 2.8.0
    rxjs: ^7.8.2
    tslib: ^2.8.1
  weapp:
    miniprogram-simulate: 1.6.2
    j-component: 1.4.10

allowBuilds:
  "@parcel/watcher": false
  rs-module-lexer: false
  # Angular's build tooling (spike of packages/angular)
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  # Taro's helper tooling (spike of packages/taro)
  "@swc/core": false
  # deprecated transitive dependency of the React Native tooling
  core-js: false
peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y 6.x works with ESLint 10 flat config but has not widened its range yet
    "eslint-plugin-jsx-a11y>eslint": "10"
    # build-tool peer of @tarojs/taro, unused by the Taro spike's tests
    "@tarojs/taro>rollup": "4"
minimumReleaseAgeExclude:
  - "@angular/common@22.2.2"
  - "@angular/compiler-cli@22.2.2"
  - "@angular/compiler@22.2.2"
  - "@angular/core@22.2.2"
  - "@angular/platform-browser@22.2.2"
  - "@angular/forms@22.2.2"
  - "@angular/platform-server@22.2.2"
  - "@angular/router@22.2.2"
  - "@testing-library/react-native@14.1.0"
  - react-native-web@0.21.4
