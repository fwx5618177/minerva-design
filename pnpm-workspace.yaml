packages:
  - "apps/*"
  - "packages/*"
  # private shims of the pre-rename workspace names, kept for the GitHub Pages
  # workflow (.github/workflows/deploy.yml): see tools/compat/README.md
  - "tools/compat/*"
allowBuilds:
  "@parcel/watcher": false
  rs-module-lexer: false
peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y 6.x works with ESLint 10 flat config but has not widened its range yet
    "eslint-plugin-jsx-a11y>eslint": "10"
