<div style="display: grid; gap: 12px; max-width: 420px">
  <minerva-textarea
    size="small"
    rows="2"
    aria-label="Small"
    placeholder="Small"
  ></minerva-textarea>
  <minerva-textarea
    size="large"
    rows="2"
    aria-label="Large"
    placeholder="Large"
  ></minerva-textarea>
  <minerva-textarea
    variant="filled"
    rows="2"
    aria-label="Filled"
    placeholder="Filled"
  ></minerva-textarea>
  <minerva-textarea
    readonly
    rows="2"
    value="Read-only text"
    aria-label="Read-only"
  ></minerva-textarea>
  <minerva-textarea
    disabled
    rows="2"
    value="Disabled"
    aria-label="Disabled"
  ></minerva-textarea>
  <minerva-textarea
    invalid
    rows="2"
    value="Invalid"
    aria-label="Invalid"
  ></minerva-textarea>
</div>
