<minerva-code-editor
  id="fallback-editor"
  label="JSON settings"
  language="json"
  height="180"
  load-timeout="1500"
  value='{ "theme": "dark" }'
></minerva-code-editor>
<p style="margin: 8px 0 0; display: flex; gap: 8px; align-items: center">
  <minerva-button
    id="load-engine"
    size="small"
    variant="outline"
    color="neutral"
    >Provide the engine</minerva-button
  >
  <output id="fallback-status">Waiting for an engine…</output>
</p>
