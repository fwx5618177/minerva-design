<form id="source-form" style="display: grid; gap: 8px">
  <minerva-code-editor
    id="html-editor"
    name="source"
    label="HTML source"
    language="html"
    height="240"
    value="<h1>Hello</h1>&#10;<p>Edit me.</p>&#10;"
  ></minerva-code-editor>
  <p style="margin: 0">
    <minerva-button type="submit" size="small">Submit</minerva-button>
    <output id="html-length"></output>
  </p>
</form>
