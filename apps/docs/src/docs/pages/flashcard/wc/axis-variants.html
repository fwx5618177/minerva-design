<div
  style="
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  "
>
  <minerva-flashcard
    variant="elevated"
    front="elevated · axis y"
    back="Flips horizontally"
    min-height="140"
  ></minerva-flashcard>
  <minerva-flashcard
    variant="outline"
    axis="x"
    front="outline · axis x"
    back="Flips vertically"
    min-height="140"
  ></minerva-flashcard>
  <minerva-flashcard
    variant="filled"
    size="small"
    front="filled · small"
    back="Less padding, smaller type"
    min-height="140"
  ></minerva-flashcard>
  <minerva-flashcard
    size="large"
    front="large"
    back="The card grows to fit the taller face: this answer is much longer than the question, and the card height follows it on both sides."
    min-height="140"
  ></minerva-flashcard>
</div>
