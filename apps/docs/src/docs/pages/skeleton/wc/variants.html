<div style="display: grid; gap: 16px">
  <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
    <minerva-skeleton
      variant="circular"
      width="48"
      height="48"
    ></minerva-skeleton>
    <minerva-skeleton
      variant="rectangular"
      width="120"
      height="48"
    ></minerva-skeleton>
    <minerva-skeleton
      variant="rounded"
      width="120"
      height="48"
    ></minerva-skeleton>
    <minerva-skeleton variant="button" width="96"></minerva-skeleton>
    <minerva-skeleton
      variant="image"
      width="120"
      height="80"
    ></minerva-skeleton>
  </div>
  <div style="display: grid; gap: 8px">
    <minerva-skeleton animation="pulse" width="80%"></minerva-skeleton>
    <minerva-skeleton animation="wave" width="80%"></minerva-skeleton>
    <minerva-skeleton
      animation="false"
      width="80%"
      border-radius="0"
    ></minerva-skeleton>
  </div>
  <minerva-skeleton
    variant="card"
    avatar
    heading
    paragraph
    active
  ></minerva-skeleton>
</div>
