<minerva-dashboard-columns id="queue" aria-label="Support queue" height="320">
  <minerva-dashboard-column
    heading="Inbox"
    color="info"
    data-prefix="Ticket"
    data-count="12"
  ></minerva-dashboard-column>
  <minerva-dashboard-column
    heading="Triaged"
    color="warning"
    data-prefix="Bug"
    data-count="5"
  ></minerva-dashboard-column>
  <minerva-dashboard-column
    heading="Fixed"
    color="success"
    data-prefix="Fix"
    data-count="8"
  ></minerva-dashboard-column>
</minerva-dashboard-columns>
