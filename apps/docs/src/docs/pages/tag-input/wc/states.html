<div style="display: grid; gap: 12px">
  <minerva-tag-input
    aria-label="Small"
    size="small"
    value="small"
  ></minerva-tag-input>
  <minerva-tag-input
    aria-label="Large"
    size="large"
    value="large"
  ></minerva-tag-input>
  <minerva-tag-input
    aria-label="Invalid"
    invalid
    value="invalid"
  ></minerva-tag-input>
  <minerva-tag-input
    aria-label="Read-only"
    readonly
    value="archived, 2024"
  ></minerva-tag-input>
  <minerva-tag-input
    aria-label="Disabled"
    disabled
    value="locked"
  ></minerva-tag-input>
</div>
