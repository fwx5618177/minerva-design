<form
  id="price-form"
  style="display: grid; gap: 12px; width: 100%; max-width: 420px"
>
  <minerva-slider
    id="price"
    aria-label="Price"
    name="price"
    range
    value="20,80"
    step="5"
    tooltip
  ></minerva-slider>
  <output id="price-output">From $20 to $80</output>
</form>
