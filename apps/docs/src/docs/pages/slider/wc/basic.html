<div style="display: grid; gap: 12px; width: 100%; max-width: 420px">
  <minerva-slider
    id="volume"
    aria-label="Volume"
    value="40"
    show-value
    tooltip
  ></minerva-slider>
  <minerva-slider
    aria-label="Opacity"
    value="0.6"
    min="0"
    max="1"
    step="0.05"
    show-value
  ></minerva-slider>
  <output id="volume-output">Volume: 40</output>
</div>
