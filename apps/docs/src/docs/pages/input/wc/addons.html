<div style="display: grid; gap: 12px; max-width: 360px">
  <minerva-input type="url" aria-label="Website" placeholder="example.com">
    <span slot="prefix">https://</span>
  </minerva-input>
  <minerva-input
    type="number"
    aria-label="Weight"
    value="72"
    min="0"
    step="0.5"
  >
    <span slot="suffix">kg</span>
  </minerva-input>
  <minerva-input
    type="search"
    clearable
    value="web components"
    aria-label="Search"
  >
    <span slot="prefix" aria-hidden="true">🔍</span>
  </minerva-input>
  <minerva-input
    show-char-count
    maxlength="40"
    value="Character count"
    aria-label="Title"
  ></minerva-input>
  <minerva-input
    type="password"
    value="correct horse"
    aria-label="Password"
    autocomplete="current-password"
  ></minerva-input>
</div>
