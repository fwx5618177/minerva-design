<div style="display: grid; gap: 16px; justify-items: start">
  <minerva-switch
    off-label="Monthly"
    on-label="Yearly"
    aria-label="Yearly billing"
  ></minerva-switch>
  <minerva-switch
    variant="segmented"
    off-label="List"
    on-label="Grid"
    checked
    aria-label="View"
  ></minerva-switch>
  <minerva-switch
    variant="segmented"
    size="small"
    color="success"
    off-label="Draft"
    on-label="Published"
    aria-label="Publication status"
  ></minerva-switch>
</div>
