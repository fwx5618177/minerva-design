    <!--
      First paint: apply the stored theme before any CSS / JS loads, and show
      a static shell (header + page skeleton) inside #root. React replaces it
      on its first render; PageSkeleton (src/site) mirrors it for later
      route loads. Checked by src/site/bootShell.test.ts.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var mode = null;
        try {
          mode = localStorage.getItem("minerva-docs-theme");
        } catch (e) {}
        var dark =
          mode === "dark" ||
          mode === "github-dark" ||
          (mode !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        var path = location.hash.replace(/^#\/?/, "").split("?")[0];
        root.setAttribute("data-boot", path ? "doc" : "home");
      })();
    </script>
