<div style="display: grid; gap: 12px; max-width: 280px">
  <label for="ni-price">Price (step 0.25, two decimals, never empty)</label>
  <div style="display: flex; gap: 8px; align-items: center">
    <minerva-number-input
      id="ni-price"
      value="9.5"
      min="0"
      step="0.25"
      precision="2"
      no-empty
    ></minerva-number-input>
    <minerva-button
      id="ni-down"
      variant="outline"
      color="neutral"
      aria-label="Step down"
      >−</minerva-button
    >
    <minerva-button
      id="ni-up"
      variant="outline"
      color="neutral"
      aria-label="Step up"
      >+</minerva-button
    >
  </div>
  <minerva-number-input
    size="small"
    value="3"
    readonly
    aria-label="Read-only"
  ></minerva-number-input>
  <minerva-number-input
    size="large"
    value="42"
    disabled
    show-stepper
    aria-label="Disabled"
  ></minerva-number-input>
</div>
