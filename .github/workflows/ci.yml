name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main release after npm may have accepted the upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Published-package type checks resolve emitted declaration files.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Test release planning
        run: pnpm test:release

      - name: Test source migration transforms
        run: pnpm test:migration

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Check mini-program API documentation against source
        run: pnpm --filter @minerva/docs check:mini-api

      - name: Install Chromium for browser E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production docs and mini renderer hosts in Chromium
        run: pnpm test:browser

      - name: Test built packages
        run: pnpm test:dist

      - name: Check package exports
        run: pnpm check:package

  mini-sdk-build:
    name: Official mini SDK (${{ matrix.renderer }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        renderer: [taro, uni]
    env:
      # Leave headroom for webpack workers on the hosted Linux runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/${{ matrix.renderer }}/spike/device/package-lock.json

      - name: Install isolated official SDK fixture
        working-directory: packages/${{ matrix.renderer }}/spike/device
        run: npm ci --no-audit --no-fund

      - name: Compile current library source for WeChat
        working-directory: packages/${{ matrix.renderer }}/spike/device
        run: npm run build

  release:
    name: Publish npm release
    needs: [verify, mini-sdk-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.NPM_AUTO_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # npm CLI handles OIDC; pnpm still installs, versions, builds and packs.
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      # Changesets compares against its local baseBranch; bind it to the tested SHA.
      - run: git checkout -B main "$GITHUB_SHA"
      - name: Plan release (requires the manual 1.0.0 to exist)
        id: plan
        run: node tools/npm-release.mjs
      - name: Apply pending changesets
        if: steps.plan.outputs.mode == 'version'
        run: |
          pnpm version-packages
          pnpm install --lockfile-only
      - name: Validate the versioned package
        if: steps.plan.outputs.mode == 'version' || steps.plan.outputs.mode == 'publish'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("packages/minerva-design/package.json")); if(p.version!==process.env.RELEASE_VERSION) throw new Error("Unexpected release version");'
          pnpm --filter minerva-design build
          pnpm test:dist
          pnpm check:package
      - name: Record version on main before publishing
        if: steps.plan.outputs.mode == 'version'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages/minerva-design/package.json packages/minerva-design/CHANGELOG.md pnpm-lock.yaml
          git commit -m "chore: release minerva-design $RELEASE_VERSION"
          # A concurrent merge or protected-branch rejection fails here, before npm.
          git push origin HEAD:main
      - name: Pack and publish via npm Trusted Publishing
        if: steps.plan.outputs.mode == 'version' || steps.plan.outputs.mode == 'publish'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/npm"
          pnpm --filter minerva-design pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/npm"
          npm publish "$GITHUB_WORKSPACE/.artifacts/npm/minerva-design-$RELEASE_VERSION.tgz" --access public --registry https://registry.npmjs.org/
      - name: Tag the published commit (safe to retry)
        if: steps.plan.outputs.mode != 'skip'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="minerva-design@$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$TAG" -m "$TAG"
          fi
          git push origin "refs/tags/$TAG"
